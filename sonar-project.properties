sonar.projectKey=nestjs-starter-kit

# sources and tests must not overlap, or the scanner fails with "file indexed
# twice". Specs live beside the code they test, so they are excluded from
# sources and claimed by tests instead.
sonar.sources=src
sonar.exclusions=**/*.module.ts,**/*.entity.ts,**/*.dto.ts,**/main.ts,**/*.spec.ts
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# sonar.typescript.lcov.reportPaths was deprecated in favour of the javascript key
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
sonar.javascript.maxFileComplexity=15
sonar.javascript.maxFunctionComplexity=10
