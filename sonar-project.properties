sonar.projectKey=nestjs-starter-kit
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.module.ts,**/*.entity.ts,**/*.dto.ts,**/main.ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.javascript.maxFileComplexity=15
sonar.javascript.maxFunctionComplexity=10
