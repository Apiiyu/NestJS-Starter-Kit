# No service declares `container_name`. A pinned name is global to the Docker
# daemon, so it collides with any other project that picked the same one — an
# unrelated `nestjs_redis` from a different repo is enough to make `dev:up` fail
# with "container name is already in use". Without it Compose scopes names to the
# project (`nestjs-starter-kit-postgres-1`), and two checkouts can run at once.
services:
  app:
    build:
      context: .
      target: builder
    restart: unless-stopped
    ports:
      - '${APP_PORT:-1337}:1337'
    environment:
      APP_NAME: ${APP_NAME:-NestJS Starter Kit}
      APP_HOST: 0.0.0.0
      APP_PORT: 1337
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME:-nestjs_starter_kit}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_PORT: 5432
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
      DATABASE_LOGGING: ${DATABASE_LOGGING:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-nestjs-starter-kit}
      METRICS_API_KEY: ${METRICS_API_KEY}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      # The host-side .env points at localhost:4318. Inside this container localhost is
      # the app itself, so the compose network must use the Jaeger service name instead.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_ENABLED: ${OTEL_METRICS_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-nestjs-starter-kit}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.0.1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_REDIS_HOST: redis-queue
      QUEUE_REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      mailpit:
        condition: service_started
      jaeger:
        condition: service_started
    command: bun run start:dev
    networks:
      - app_network

  postgres:
    # Major-version bump from 16.4. PostgreSQL refuses to start on a data
    # directory written by an older major: `FATAL: database files are
    # incompatible with server`. An existing `<project>_postgres_data` volume
    # must be dropped (or pg_upgrade'd) before this comes up — see README.
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nestjs_starter_kit}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-nestjs_starter_kit}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Separate instance from `redis` above (D9): BullMQ jobs must never be evicted
  # under memory pressure, which is the opposite policy `redis` uses for caching.
  redis-queue:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - '${QUEUE_REDIS_PORT:-6380}:6379'
    command: redis-server --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAIL_SMTP_PORT:-1025}:1025'
      - '${MAIL_UI_PORT:-8025}:8025'
    networks:
      - app_network

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
      - '${OTEL_GRPC_PORT:-4317}:4317'
      - '${OTEL_HTTP_PORT:-4318}:4318'
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
