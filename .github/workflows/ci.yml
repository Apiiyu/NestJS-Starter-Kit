name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce architecture boundaries
        run: bun run architecture:check

  sdk:
    name: OpenAPI contract and TypeScript SDK
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nestjs_starter_kit_sdk
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nestjs_starter_kit_sdk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis-queue:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_EXTERNAL_BASE_URL: http://127.0.0.1:1337
      APP_ENV: test
      APP_HOST: 127.0.0.1
      APP_NAME: NestJS Starter Kit
      APP_PORT: 1337
      APP_TRUST_PROXY: 'false'
      DATABASE_HOST: 127.0.0.1
      DATABASE_LOGGING: 'false'
      DATABASE_MIGRATIONS_RUN: 'false'
      DATABASE_NAME: nestjs_starter_kit_sdk
      DATABASE_PASSWORD: postgres
      DATABASE_PORT: 5432
      DATABASE_SYNCHRONIZE: 'false'
      DATABASE_USER: postgres
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: nestjs-starter-kit-sdk
      JWT_REFRESH_EXPIRES_IN: 7d
      MAIL_FROM: noreply@example.test
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 2525
      OTEL_ENABLED: 'false'
      OTEL_METRICS_ENABLED: 'false'
      QUEUE_REDIS_HOST: 127.0.0.1
      QUEUE_REDIS_PORT: 6380
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      THROTTLE_LIMIT: 1000
      THROTTLE_TTL: 60000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate ephemeral credentials
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "METRICS_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: bun run migration:run

      - name: Generate and lint SDK
        run: bun run sdk:build

      - name: Upload OpenAPI and SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-typescript-sdk
          path: |
            artifacts/openapi.json
            artifacts/sdk/
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # src/, under the same module settings `nest build` uses.
      - run: bunx tsc --noEmit
      # test/ and scripts/, which the pass above cannot see: tsconfig.json excludes both
      # so they are not emitted into dist/. Nothing else type-checks them — @swc/jest
      # strips types without checking them — so without this a broken type in the e2e
      # suite or a build script only shows up by running it.
      - run: bunx tsc --noEmit -p tsconfig.tools.json

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # setup-bun does not install Node, and jest's bin has a `#!/usr/bin/env node`
      # shebang, so these suites run on whatever Node the runner image happens to ship.
      # Node 26 removed `SlowBuffer`, which breaks `buffer-equal-constant-time` (a
      # transitive dep of passport-jwt) and kills every suite that imports AppModule.
      # Pinning to .nvmrc (24.11.0) makes CI match `engines.node` instead of tracking
      # the runner image.
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: bun install --frozen-lockfile
      - run: bun run test:cov
      # `--check` verifies without writing: CI must not mutate a committed file. The
      # baseline is raised locally by `bun run coverage:ratchet` and committed with the
      # change that earned the improvement.
      - run: bun run coverage:ratchet -- --check
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Deliberately gates nothing. `lint`, `type-check` and `build` stay independent and
    # keep running in parallel; a slow container pull here must not stall the fast checks.
    # ubuntu-latest ships a working Docker daemon, so testcontainers needs no extra setup.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Same Node pin as the `test` job, and for the same passport-jwt reason.
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nestjs-starter-kit:${{ github.sha }}
